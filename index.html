<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis skins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: #000000; 
      color: #ffffff; 
      font-family: 'Poppins', sans-serif; 
      padding: 30px 20px;
      min-height: 100vh;
    }

    header { 
      text-align: center; 
      margin-bottom: 40px; 
    }
    h1 { 
      font-size: 2.2rem; 
      font-weight: 700;
      text-transform: uppercase; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
      gap: 25px; 
      max-width: 1200px;
      margin: 0 auto;
    }

    .card { 
      background: rgba(25, 25, 30, 0.55); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px; 
      overflow: hidden; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      display: flex; 
      flex-direction: column;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
      border-color: rgba(40, 167, 69, 0.5);
    }

    /* Menú de opciones (Tres Puntos) */
    .card-menu-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .card-menu-btn:hover { background: rgba(0,0,0,0.9); }

    .card-menu-dropdown {
      display: none;
      position: absolute;
      top: 48px;
      right: 10px;
      background: rgba(20, 20, 25, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      overflow: hidden;
      z-index: 10;
      backdrop-filter: blur(8px);
    }

    .card-menu-dropdown button {
      display: block;
      width: 100%;
      padding: 8px 16px;
      background: none;
      border: none;
      color: #fff;
      text-align: left;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .card-menu-dropdown button:hover { background: rgba(255, 255, 255, 0.1); }
    .card-menu-dropdown button.delete-btn:hover { background: rgba(220, 53, 69, 0.3); color: #ff6b6b; }

    .card img { 
      width: 100%; 
      height: 160px; 
      object-fit: cover; 
      background: #111; 
    }

    .info { 
      padding: 16px; 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }

    .title { 
      font-weight: 600; 
      font-size: 1.05rem; 
      margin-bottom: 12px; 
      text-transform: uppercase; 
      color: #ffffff; 
      text-align: center;
    }

    .copy-btn { 
      width: 100%; 
      padding: 10px; 
      background: rgba(255, 255, 255, 0.08); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      color: #ffffff; 
      cursor: pointer; 
      border-radius: 10px; 
      font-weight: 600; 
      font-family: inherit;
      transition: all 0.2s; 
    }

    .copy-btn:hover { 
      background: #28a745; 
      border-color: #28a745; 
    }

    .add-btn { 
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #28a745; 
      color: #ffffff; 
      border: none; 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      font-size: 32px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 8px 24px rgba(40, 167, 69, 0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s;
      z-index: 99;
    }

    .add-btn:hover { 
      transform: scale(1.2); 
      background: #218838;
    }

    .modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0, 0, 0, 0.75); 
      backdrop-filter: blur(8px);
      justify-content: center; 
      align-items: center; 
      z-index: 100; 
    }

    .modal-content { 
      background: rgba(20, 20, 25, 0.85); 
      backdrop-filter: blur(16px);
      padding: 30px; 
      border-radius: 20px; 
      width: 90%; 
      max-width: 420px; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
    }

    .modal-content h2 { 
      margin-bottom: 20px; 
      font-size: 1.3rem; 
      font-weight: 600;
      text-align: center;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    
    .form-group input, .form-group textarea { 
      width: 100%; 
      padding: 10px; 
      background: rgba(0, 0, 0, 0.5); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      color: #fff; 
      border-radius: 10px; 
      font-family: inherit; 
    }

    .form-group textarea { resize: vertical; height: 70px; }

    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; }
    
    .btn-cancel { 
      background: rgba(255, 255, 255, 0.1); 
      color: #fff; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit;
    }

    .btn-save { 
      background: #28a745; 
      color: #fff; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 600;
      font-family: inherit;
    }

    .loading-msg { text-align: center; color: #888; grid-column: 1 / -1; margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <h1>Mis skins</h1>
  </header>

  <div class="grid" id="skinsContainer">
    <div class="loading-msg">Cargando skins...</div>
  </div>

  <button class="add-btn" id="openModalBtn" title="Añadir Skin">+</button>

  <!-- Modal / Formulario -->
  <div class="modal" id="skinModal">
    <div class="modal-content">
      <h2 id="modalTitle">Añadir Nueva Skin</h2>
      <form id="skinForm">
        <input type="hidden" id="editingSkinId" value="">
        <input type="hidden" id="existingImageUrl" value="">
        
        <div class="form-group">
          <label>Nombre de la Skin</label>
          <input type="text" id="skinTitle" placeholder="Ej: Blood Devil" required>
        </div>
        <div class="form-group">
          <label>Foto de la Skin (Opcional)</label>
          <input type="file" id="skinImage" accept="image/*">
        </div>
        <div class="form-group">
          <label>Código de  Skin (Evrima)</label>
          <textarea id="skinCode" placeholder="Pega el código del juego..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="closeModalBtn">Cancelar</button>
          <button type="submit" class="btn-save" id="saveBtn">Guardar Skin</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SDKs de Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // 🔑 CLAVE SECRETA PARA EDITAR / ELIMINAR (Cámbiala por la que tú quieras)
    const ADMIN_PIN = "12134"; 
    
    // Imagen por defecto si no subes foto
    const DEFAULT_IMAGE = "https://via.placeholder.com/300x160/111115/888888?text=Sin+Foto";

    const firebaseConfig = {
      apiKey: "AIzaSyDpy6CtKqXbqPUhuyVRv6NvQZkwfv-i5U4",
      authDomain: "evrima-skins.firebaseapp.com",
      projectId: "evrima-skins",
      storageBucket: "evrima-skins.firebasestorage.app",
      messagingSenderId: "514495308445",
      appId: "1:514495308445:web:28fb51497dc6c9e8c32a74",
      measurementId: "G-Y374SVYG8V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const modal = document.getElementById('skinModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const skinForm = document.getElementById('skinForm');
    const skinsContainer = document.getElementById('skinsContainer');
    const saveBtn = document.getElementById('saveBtn');
    const modalTitle = document.getElementById('modalTitle');

    // Generador de sonido "Tic"
    const playTicSound = () => {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    };

    openModalBtn.addEventListener('mouseenter', playTicSound);
    openModalBtn.addEventListener('click', () => {
      skinForm.reset();
      document.getElementById('editingSkinId').value = '';
      document.getElementById('existingImageUrl').value = '';
      modalTitle.innerText = "Añadir Nueva Skin";
      modal.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => modal.style.display = 'none');

    // Cargar skins en tiempo real
    const q = query(collection(db, "skins"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      skinsContainer.innerHTML = '';
      if(snapshot.empty) {
        skinsContainer.innerHTML = '<div class="loading-msg">No hay skins publicadas aún.</div>';
        return;
      }
      
      snapshot.forEach((documento) => {
        const skin = documento.data();
        const id = documento.id;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <button class="card-menu-btn" onclick="toggleMenu('${id}')">⋮</button>
          <div class="card-menu-dropdown" id="menu-${id}">
            <button onclick="editSkin('${id}', \`${skin.title}\`, \`${skin.code}\`, '${skin.imageUrl}')">Editar</button>
            <button class="delete-btn" onclick="deleteSkin('${id}')">Eliminar</button>
          </div>
          <img src="${skin.imageUrl || DEFAULT_IMAGE}" alt="${skin.title}">
          <div class="info">
            <div class="title">${skin.title}</div>
            <button class="copy-btn">Copy Code</button>
          </div>
        `;

        const copyBtn = card.querySelector('.copy-btn');
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(skin.code).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = '¡Copiado!';
            copyBtn.style.background = '#28a745';
            setTimeout(() => {
              copyBtn.innerText = originalText;
              copyBtn.style.background = 'rgba(255, 255, 255, 0.08)';
            }, 1500);
          });
        });

        skinsContainer.appendChild(card);
      });
    });

    // Desplegar menú de 3 puntos
    window.toggleMenu = (id) => {
      const dropdown = document.getElementById(`menu-${id}`);
      const isVisible = dropdown.style.display === 'block';
      document.querySelectorAll('.card-menu-dropdown').forEach(d => d.style.display = 'none');
      dropdown.style.display = isVisible ? 'none' : 'block';
    };

    // Cerrar menús al hacer clic fuera
    document.addEventListener('click', (e) => {
      if (!e.target.classList.contains('card-menu-btn')) {
        document.querySelectorAll('.card-menu-dropdown').forEach(d => d.style.display = 'none');
      }
    });

    // Función para Editar
    window.editSkin = (id, title, code, imageUrl) => {
      const pass = prompt("Introduce tu clave para editar:");
      if (pass !== ADMIN_PIN) return alert("Clave incorrecta.");

      document.getElementById('editingSkinId').value = id;
      document.getElementById('skinTitle').value = title;
      document.getElementById('skinCode').value = code;
      document.getElementById('existingImageUrl').value = imageUrl;

      modalTitle.innerText = "Editar Skin";
      modal.style.display = 'flex';
    };

    // Función para Eliminar
    window.deleteSkin = async (id) => {
      const pass = prompt("Introduce tu clave para eliminar:");
      if (pass !== ADMIN_PIN) return alert("Clave incorrecta.");

      if (confirm("¿Seguro que quieres eliminar esta skin?")) {
        try {
          await deleteDoc(doc(db, "skins", id));
        } catch (error) {
          alert("Error al eliminar la skin.");
        }
      }
    };

    // Guardar (Crear o Actualizar)
    skinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const editingId = document.getElementById('editingSkinId').value;
      const fileInput = document.getElementById('skinImage');
      const file = fileInput.files[0];
      
      saveBtn.innerText = "Guardando...";
      saveBtn.disabled = true;

      try {
        let imageUrl = document.getElementById('existingImageUrl').value || DEFAULT_IMAGE;

        // Subir foto nueva solo si seleccionó un archivo
        if (file) {
          const storageRef = ref(storage, 'skins/' + Date.now() + '_' + file.name);
          await uploadBytes(storageRef, file);
          imageUrl = await getDownloadURL(storageRef);
        }

        const skinData = {
          title: document.getElementById('skinTitle').value,
          code: document.getElementById('skinCode').value,
          imageUrl: imageUrl,
        };

        if (editingId) {
          // Actualizar skin existente
          await updateDoc(doc(db, "skins", editingId), skinData);
        } else {
          // Crear skin nueva
          skinData.createdAt = new Date();
          await addDoc(collection(db, "skins"), skinData);
        }

        skinForm.reset();
        modal.style.display = 'none';
      } catch (error) {
        console.error("Error:", error);
        alert("Ocurrió un error al guardar.");
      } finally {
        saveBtn.innerText = "Guardar Skin";
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
