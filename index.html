<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis skins</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f0f11; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid #2a2a30; }
    h1 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }
    
    .add-btn { background: #007acc; color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .add-btn:hover { background: #005999; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: #18181c; border-radius: 8px; overflow: hidden; border: 1px solid #2a2a30; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 150px; object-fit: cover; background: #000; }
    .info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .title { font-weight: bold; font-size: 1rem; margin-bottom: 4px; text-transform: uppercase; color: #fff; }
    .author { font-size: 0.8rem; color: #888; margin-bottom: 12px; }
    .copy-btn { width: 100%; padding: 8px; background: #25252b; border: 1px solid #3a3a42; color: #fff; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; }
    .copy-btn:hover { background: #32323a; border-color: #007acc; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #18181c; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; border: 1px solid #2a2a30; }
    .modal-content h2 { margin-bottom: 15px; font-size: 1.2rem; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px; background: #0f0f11; border: 1px solid #3a3a42; color: #fff; border-radius: 4px; font-family: inherit; }
    .form-group textarea { resize: vertical; height: 60px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel { background: #3a3a42; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    .btn-save { background: #007acc; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    .loading-msg { text-align: center; color: #aaa; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <h1>Evrima Skins Index</h1>
    <button class="add-btn" id="openModalBtn" title="Añadir Skin">+</button>
  </header>

  <div class="grid" id="skinsContainer">
    <div class="loading-msg">Cargando skins...</div>
  </div>

  <!-- Modal / Formulario -->
  <div class="modal" id="skinModal">
    <div class="modal-content">
      <h2>Añadir Nueva Skin</h2>
      <form id="skinForm">
        <div class="form-group">
          <label>Nombre de la Skin</label>
          <input type="text" id="skinTitle" placeholder="Ej: Blood Devil" required>
        </div>
        <div class="form-group">
          <label>Creador / Referencia</label>
          <input type="text" id="skinAuthor" placeholder="Ej: Spezi" required>
        </div>
        <div class="form-group">
          <label>Foto de la Skin</label>
          <input type="file" id="skinImage" accept="image/*" required>
        </div>
        <div class="form-group">
          <label>Código de la Skin (Evrima)</label>
          <textarea id="skinCode" placeholder="Pega el código del juego..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="closeModalBtn">Cancelar</button>
          <button type="submit" class="btn-save" id="saveBtn">Guardar Skin</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SDKs de Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Configuracion de tu proyecto Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDpy6CtKqXbqPUhuyVRv6NvQZkwfv-i5U4",
      authDomain: "evrima-skins.firebaseapp.com",
      projectId: "evrima-skins",
      storageBucket: "evrima-skins.firebasestorage.app",
      messagingSenderId: "514495308445",
      appId: "1:514495308445:web:28fb51497dc6c9e8c32a74",
      measurementId: "G-Y374SVYG8V"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Elementos del DOM
    const modal = document.getElementById('skinModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const skinForm = document.getElementById('skinForm');
    const skinsContainer = document.getElementById('skinsContainer');
    const saveBtn = document.getElementById('saveBtn');

    openModalBtn.addEventListener('click', () => modal.style.display = 'flex');
    closeModalBtn.addEventListener('click', () => modal.style.display = 'none');

    // Cargar skins en tiempo real desde la nube
    const q = query(collection(db, "skins"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      skinsContainer.innerHTML = '';
      if(snapshot.empty) {
        skinsContainer.innerHTML = '<div class="loading-msg">No hay skins publicadas aún.</div>';
        return;
      }
      
      snapshot.forEach((doc) => {
        const skin = doc.data();
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${skin.imageUrl}" alt="${skin.title}">
          <div class="info">
            <div>
              <div class="title">${skin.title}</div>
              <div class="author">by ${skin.author}</div>
            </div>
            <button class="copy-btn">Copy Code</button>
          </div>
        `;

        // Evento del botón copiar
        const copyBtn = card.querySelector('.copy-btn');
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(skin.code).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = '¡Copiado!';
            copyBtn.style.background = '#28a745';
            setTimeout(() => {
              copyBtn.innerText = originalText;
              copyBtn.style.background = '#25252b';
            }, 1500);
          });
        });

        skinsContainer.appendChild(card);
      });
    });

    // Subir nueva skin a la nube
    skinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fileInput = document.getElementById('skinImage');
      const file = fileInput.files[0];
      if (!file) return;

      saveBtn.innerText = "Subiendo...";
      saveBtn.disabled = true;

      try {
        // 1. Subir imagen a Firebase Storage
        const storageRef = ref(storage, 'skins/' + Date.now() + '_' + file.name);
        await uploadBytes(storageRef, file);
        const imageUrl = await getDownloadURL(storageRef);

        // 2. Guardar datos en Firestore
        await addDoc(collection(db, "skins"), {
          title: document.getElementById('skinTitle').value,
          author: document.getElementById('skinAuthor').value,
          code: document.getElementById('skinCode').value,
          imageUrl: imageUrl,
          createdAt: new Date()
        });

        skinForm.reset();
        modal.style.display = 'none';
      } catch (error) {
        console.error("Error al subir:", error);
        alert("Error al subir la skin. Asegúrate de haber habilitado Firestore y Storage en Modo Prueba.");
      } finally {
        saveBtn.innerText = "Guardar Skin";
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
