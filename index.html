<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis skins</title>
  <!-- Fuente tipográfica moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: #000000; 
      color: #ffffff; 
      font-family: 'Poppins', sans-serif; 
      padding: 30px 20px;
      min-height: 100vh;
    }

    /* Título Centrado */
    header { 
      text-align: center; 
      margin-bottom: 40px; 
    }
    h1 { 
      font-size: 2.2rem; 
      font-weight: 700;
      text-transform: uppercase; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    /* Grilla de Galería */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
      gap: 25px; 
      max-width: 1200px;
      margin: 0 auto;
    }

    /* UI Transparente Cuadriculada (Glassmorphism) con esquinas redondeadas */
    .card { 
      background: rgba(25d, 25, 30, 0.55); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px; 
      overflow: hidden; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      display: flex; 
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s;
    }

    /* Animación al pasar el mouse por la tarjeta */
    .card:hover {
      transform: scale(1.05);
      border-color: rgba(40, 167, 69, 0.5);
    }

    .card img { 
      width: 100%; 
      height: 160px; 
      object-fit: cover; 
      background: #000000; 
    }

    .info { 
      padding: 16px; 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }

    .title { 
      font-weight: 600; 
      font-size: 1.05rem; 
      margin-bottom: 12px; 
      text-transform: uppercase; 
      color: #ffffff; 
      text-align: center;
    }

    .copy-btn { 
      width: 100%; 
      padding: 10px; 
      background: rgba(255, 255, 255, 0.08); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      color: #ffffff; 
      cursor: pointer; 
      border-radius: 10px; 
      font-weight: 600; 
      font-family: inherit;
      transition: all 0.2s; 
    }

    .copy-btn:hover { 
      background: #28a745; 
      border-color: #28a745; 
    }

    /* Botón Flotante + en forma de burbuja */
    .add-btn { 
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #28a745; 
      color: #ffffff; 
      border: none; 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      font-size: 32px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 8px 24px rgba(40, 167, 69, 0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s;
      z-index: 99;
    }

    .add-btn:hover { 
      transform: scale(1.2); 
      background: #218838;
    }

    /* Modal / Ventana Transparente */
    .modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0, 0, 0, 0.75); 
      backdrop-filter: blur(8px);
      justify-content: center; 
      align-items: center; 
      z-index: 100; 
    }

    .modal-content { 
      background: rgba(20, 20, 25, 0.85); 
      backdrop-filter: blur(16px);
      padding: 30px; 
      border-radius: 20px; 
      width: 90%; 
      max-width: 420px; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
    }

    .modal-content h2 { 
      margin-bottom: 20px; 
      font-size: 1.3rem; 
      font-weight: 600;
      text-align: center;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    
    .form-group input, .form-group textarea { 
      width: 100%; 
      padding: 10px; 
      background: rgba(0, 0, 0, 0.5); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      color: #fff; 
      border-radius: 10px; 
      font-family: inherit; 
    }

    .form-group textarea { resize: vertical; height: 70px; }

    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; }
    
    .btn-cancel { 
      background: rgba(255, 255, 255, 0.1); 
      color: #fff; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-family: inherit;
    }

    .btn-save { 
      background: #28a745; 
      color: #fff; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 600;
      font-family: inherit;
    }

    .loading-msg { text-align: center; color: #888; grid-column: 1 / -1; margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <h1>Mis skins</h1>
  </header>

  <div class="grid" id="skinsContainer">
    <div class="loading-msg">Cargando skins...</div>
  </div>

  <!-- Botón Burbuja Flotante (+) -->
  <button class="add-btn" id="openModalBtn" title="Añadir Skin">+</button>

  <!-- Modal / Formulario -->
  <div class="modal" id="skinModal">
    <div class="modal-content">
      <h2>Añadir Nueva Skin</h2>
      <form id="skinForm">
        <div class="form-group">
          <label>Nombre de la Skin</label>
          <input type="text" id="skinTitle" placeholder="Ej: Blood Devil" required>
        </div>
        <div class="form-group">
          <label>Foto de la Skin</label>
          <input type="file" id="skinImage" accept="image/*" required>
        </div>
        <div class="form-group">
          <label>Código de la Skin (Evrima)</label>
          <textarea id="skinCode" placeholder="Pega el código del juego..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="closeModalBtn">Cancelar</button>
          <button type="submit" class="btn-save" id="saveBtn">Guardar Skin</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SDKs de Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Configuracion de tu proyecto Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDpy6CtKqXbqPUhuyVRv6NvQZkwfv-i5U4",
      authDomain: "evrima-skins.firebaseapp.com",
      projectId: "evrima-skins",
      storageBucket: "evrima-skins.firebasestorage.app",
      messagingSenderId: "514495308445",
      appId: "1:514495308445:web:28fb51497dc6c9e8c32a74",
      measurementId: "G-Y374SVYG8V"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Elementos DOM
    const modal = document.getElementById('skinModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const skinForm = document.getElementById('skinForm');
    const skinsContainer = document.getElementById('skinsContainer');
    const saveBtn = document.getElementById('saveBtn');

    // Generador de sonido "Tic" al pasar el mouse por el botón +
    const playTicSound = () => {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    };

    openModalBtn.addEventListener('mouseenter', playTicSound);
    openModalBtn.addEventListener('click', () => modal.style.display = 'flex');
    closeModalBtn.addEventListener('click', () => modal.style.display = 'none');

    // Cargar skins desde Firestore
    const q = query(collection(db, "skins"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      skinsContainer.innerHTML = '';
      if(snapshot.empty) {
        skinsContainer.innerHTML = '<div class="loading-msg">No hay skins publicadas aún.</div>';
        return;
      }
      
      snapshot.forEach((doc) => {
        const skin = doc.data();
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${skin.imageUrl}" alt="${skin.title}">
          <div class="info">
            <div class="title">${skin.title}</div>
            <button class="copy-btn">Copy Code</button>
          </div>
        `;

        // Evento botón copiar
        const copyBtn = card.querySelector('.copy-btn');
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(skin.code).then(() => {
            const originalText = copyBtn.innerText;
            copyBtn.innerText = '¡Copiado!';
            copyBtn.style.background = '#28a745';
            setTimeout(() => {
              copyBtn.innerText = originalText;
              copyBtn.style.background = 'rgba(255, 255, 255, 0.08)';
            }, 1500);
          });
        });

        skinsContainer.appendChild(card);
      });
    });

    // Subir skin
    skinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fileInput = document.getElementById('skinImage');
      const file = fileInput.files[0];
      if (!file) return;

      saveBtn.innerText = "Subiendo...";
      saveBtn.disabled = true;

      try {
        const storageRef = ref(storage, 'skins/' + Date.now() + '_' + file.name);
        await uploadBytes(storageRef, file);
        const imageUrl = await getDownloadURL(storageRef);

        await addDoc(collection(db, "skins"), {
          title: document.getElementById('skinTitle').value,
          code: document.getElementById('skinCode').value,
          imageUrl: imageUrl,
          createdAt: new Date()
        });

        skinForm.reset();
        modal.style.display = 'none';
      } catch (error) {
        console.error("Error al subir:", error);
        alert("Error al subir la skin.");
      } finally {
        saveBtn.innerText = "Guardar Skin";
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
